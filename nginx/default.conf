map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
map $remote_addr $client_rate_key { default $binary_remote_addr; }
limit_req_zone $client_rate_key zone=general_limit:10m rate=60r/s;
limit_req_zone $client_rate_key zone=login_limit:10m rate=60r/m;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80 default_server;
  server_name _;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location / { return 444; }
}

server {
  listen 80;
  server_name dash-monitor.carubra.com;
  server_tokens off;
  limit_req_status 429;
  client_max_body_size 12m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  location = /api/health { access_log off; return 404; }

  location / {
    limit_req zone=general_limit burst=40 nodelay;
    set $app_upstream http://utero-monitor-app:3000;
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location ^~ /api/auth/ {
    limit_req zone=login_limit burst=10 nodelay;
    set $app_upstream http://utero-monitor-app:3000;
    proxy_pass $app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /login {
    limit_req zone=login_limit burst=5 nodelay;
    set $app_upstream http://utero-monitor-app:3000;
    proxy_pass $app_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
