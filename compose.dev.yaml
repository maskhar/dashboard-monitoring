services:
  app:
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3010}:3000"
    environment:
      AUTH_MODE: development
      AUTH_DEMO_ENABLED: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXTAUTH_URL: http://localhost:${APP_HOST_PORT:-3010}
  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
  nginx:
    volumes:
      - ./nginx/development.conf:/etc/nginx/conf.d/default.conf:ro
