services:
  app:
    image: utero-dashboard-monitoring:${APP_VERSION:-0.1.0}-${BUILD_REVISION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
        BUILD_REVISION: ${BUILD_REVISION:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      AUTH_MODE: production
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://dash-monitor.carubra.com}
      AUTH_DEMO_ENABLED: "false"
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
      DEMO_STAFF_EMAIL: ${DEMO_STAFF_EMAIL:-}
      DEMO_STAFF_PASSWORD: ${DEMO_STAFF_PASSWORD:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      UPLOAD_DIR: /app/uploads
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      backend:
        aliases: [utero-monitor-app]

  nginx:
    image: nginx:alpine@sha256:892bb2152464f0c5d8972593a5f5afaf8054552580b699d95f8ff4af08c2d33d
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://utero-monitor-app:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      backend:
      carubra-network:
        aliases: [utero-monitor-nginx]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    init: true
    command: ["npm", "run", "notifications:worker"]
    environment:
      NODE_ENV: production
      AUTH_MODE: production
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      NOTIFICATION_WEBHOOK_TOKEN: ${NOTIFICATION_WEBHOOK_TOKEN:-}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-5000}
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "ps | grep '[n]otification-worker' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  monitor:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: unless-stopped
    init: true
    command: ["npm", "run", "monitor"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      APP_HEALTH_URL: http://app:3000/api/health
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      BACKUP_DIR: /backups
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-90000}
      MONITOR_POLL_MS: ${MONITOR_POLL_MS:-60000}
      MONITOR_TIMEOUT_MS: ${MONITOR_TIMEOUT_MS:-10000}
      MONITOR_HEARTBEAT_MS: ${MONITOR_HEARTBEAT_MS:-3600000}
      MONITOR_SERVICE_NAME: ${MONITOR_SERVICE_NAME:-utero-dashboard}
      MONITOR_WEBHOOK_URL: ${MONITOR_WEBHOOK_URL:-}
      NOTIFICATION_MAX_STALE_SECONDS: ${NOTIFICATION_MAX_STALE_SECONDS:-900}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
    depends_on:
      app:
        condition: service_healthy
      clamav:
        condition: service_healthy
      backup:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps | grep '[m]onitor.ts' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [backend]

  clamav:
    image: clamav/clamav@sha256:8ad6197396974726c35d017e50aaaaf4b91745726a04faec8480c203edd98052
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks: [backend]

  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    restart: "no"
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  backup:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/backup/backup.sh"]
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/opt/backup/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - app_uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup-healthy && test $$(($$(date +%s) - $$(cat /tmp/backup-healthy))) -lt $${BACKUP_INTERVAL_SECONDS:-86400}"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 2m
    networks: [backend]

  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Jakarta}
      PGTZ: ${TZ:-Asia/Jakarta}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [backend]

volumes:
  postgres_data:
  app_uploads:
  clamav_data:

networks:
  backend:
    driver: bridge
  carubra-network:
    external: true

